<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shoe WebAR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; }
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
        }
        /* Full-screen loading overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Change this to match your brand */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease; /* Smooth fade-out when done */
        }

        /* The actual bar container */
        .progress-container {
            width: 200px;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }

        /* The moving part of the bar */
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #000000; /* Black bar for a premium look */
            transition: width 0.2s ease;
        }

        #loading-text {
            font-family: sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="shoe.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1">

        <model-viewer 
    id="shoe-viewer"
    src="shoe.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1">

    <div id="loading-overlay" slot="progress-bar">
    <div id="loading-text">Preparing Model...</div> 
    <div class="progress-container">
        <div id="update-bar" class="progress-fill"></div>
    </div>
</div>

</model-viewer>
    </model-viewer>
<script>
    const modelViewer = document.querySelector('#shoe-viewer');
    const progressBar = document.querySelector('#update-bar');
    const overlay = document.querySelector('#loading-overlay');
    const statusText = document.querySelector('#loading-text');

    let fakeProgress = 0;

    // 1. Create a "Slow Crawl" for the progress bar
    const interval = setInterval(() => {
        if (fakeProgress < 90) { // Crawl up to 90%
            fakeProgress += Math.random() * 2; // Random small increments
            progressBar.style.width = `${fakeProgress}%`;
        }
        
        // Change text based on the fake percentage
        if (fakeProgress > 45 && fakeProgress < 80) {
            statusText.innerText = "Finalizing...";
        }
    }, 100); // Updates every 100ms

    // 2. Only finish the bar and hide when the actual model is ready
    modelViewer.addEventListener('load', () => {
        // Wait an extra second after it's loaded to show "Finalizing"
        setTimeout(() => {
            clearInterval(interval); // Stop the slow crawl
            progressBar.style.width = '100%'; // Snap to finish
            statusText.innerText = "Ready!";

            // Final delay before the shoe is revealed
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);
            }, 1000); 
        }, 2000);
    });
</script>
</body>
</html>
